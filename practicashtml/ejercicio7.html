<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario datos personales</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Datos personales</legend>

            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">
            </div>
            <div>
                <label for="apellido">Apellidos:</label>
                <input type="text" id="apellidos">
            </div>
            <div>
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha">
            </div>
            <div>
                <label for="fruta">Pais de nacimiento</label>
                <select id="pais">
                    <option>Argentina</option>
                    <option>España</option>
                    <option>México</option>
                    <option>Guatemala</option>
                    <option>Honduras</option>
                    <option>El Salvador</option>
                    <option>Venezuela</option>
                    <option>Colombia</option>
                    <option>Cuba</option>
                    <option>Bolivia</option>
                    <option>Perú</option>
                    <option>Ecuador</option>
                    <option>Paraguay</option>
                    <option>Uruguay</option>
                    <option>Chile</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <legend>Datos del lugar de trabajo</legend>

            <div>
                <label for="sitio">Sitio de trabajo</label>
                <input type="text">
            </div>
            <div>
                <label for="puesto">Puesto de trabajo</label>
                <input type="text">
            </div>
            <div>
                <label for="fruta">Pais del lugar de trabajo</label>
                <select id="pais">
                    <option>Argentina</option>
                    <option>España</option>
                    <option>México</option>
                    <option>Guatemala</option>
                    <option>Honduras</option>
                    <option>El Salvador</option>
                    <option>Venezuela</option>
                    <option>Colombia</option>
                    <option>Cuba</option>
                    <option>Bolivia</option>
                    <option>Perú</option>
                    <option>Ecuador</option>
                    <option>Paraguay</option>
                    <option>Uruguay</option>
                    <option>Chile</option>
                </select>
            </div>
        </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>

</html>
