<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario datos personales</title>
</head>

<body>
  <header>
    <h1>Formulario empleado</h1>
  </header>
  <main>
    <form>
      <!--añadimos un caption por accesibilidad -->
      <caption>Formulario de empleados</caption>
      <fieldset>
        <legend>Datos personales</legend>
        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" name="nombre" id="nombre" placeholder="Marina" size="20"
            title="Nombre de pila. Caracteres con tildes">
        </p>
        <p>
          <label for="apellidos">Apellidos:</label>
          <input type="text" name="apellidos" id="apellidos" placeholder="Vega Vázquez" size="40"
            title="Apellidos. Caracteres con tildes">
        </p>
        <p>
          <label for="fechaN">Fecha de nacimiento:</label>
          <input type="date" name="fechaN" id="fechaN" placeholder="22/09/1988" max="2004-09-22" min="1956-01-01"
            title="Fecha de nacimiento">
        </p>
        <p>
          <label for="direccion">Dirección:</label>
          <input type="text" name="direccion" id="direccion" size="40" placeholder="C\ Mi calle, nº 8, 2ª">
        </p>
        <p>
          <label for="fruta">Pais de nacimiento</label>
          <select id="pais">
            <option value="1">Argentina</option>
            <option value="2" selected>España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="7">El Salvador</option>
            <option value="8">Venezuela</option>
            <option value="9">Colombia</option>
            <option value="10">Cuba</option>
            <option value="11">Bolivia</option>
            <option value="13">Perú</option>
            <option value="14">Ecuador</option>
            <option value="15">Paraguay</option>
            <option value="16">Uruguay</option>
            <option value="17">Chile</option>
          </select>
        </p>
      </fieldset>
      <fieldset>
        <legend>Datos del lugar de trabajo</legend>
        <p>
          <label for="empresa">Nombre de la empresa:</label>
          <input type="text" name="empresa" id="empresa" placeholder="MiEmpresa S.L." size="20"
            title="Nombre empresa. Caracteres con tildes">
        </p>
        <p>
          <label for="url">Sitio Web:</label>
          <input type="url" name="url" id="url" placeholder="http://miempresa.es" size="30" title="Url de la empresa">
        </p>
        <p>
          <label for="puesto">Puesto de trabajo</label>
          <select name="puesto" id="puesto">
            <option value="0">Seleccione el puesto de trabajo</option>
            <option value="1">Analista</option>
            <option value="2">Diseñador</option>
            <option value="3">Programador</option>
            <option value="4">Tester</option>
            <option value="5">Otros</option>
          </select>
        </p>
        <p>
          <label for="fruta">Pais del lugar de trabajo</label>
          <select name="pais" id="pais">
            <option value="1">Argentina</option>
            <option value="2" selected>España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="7">El Salvador</option>
            <option value="8">Venezuela</option>
            <option value="9">Colombia</option>
            <option value="10">Cuba</option>
            <option value="11">Bolivia</option>
            <option value="13">Perú</option>
            <option value="14">Ecuador</option>
            <option value="15">Paraguay</option>
            <option value="16">Uruguay</option>
            <option value="17">Chile</option>
          </select>
        </p>
      </fieldset>
      <button type="submit">Enviar</button>
      <button type="reset">Borrar</button>
    </form>
  </main>
</body>

</html>
